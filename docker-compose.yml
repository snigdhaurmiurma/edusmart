services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt uvicorn && uvicorn api.index:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - .:/app

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - api
